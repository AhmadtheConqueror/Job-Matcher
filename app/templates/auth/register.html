{% extends "base.html" %}

{% block title %}Create Account | AI Career Assistant{% endblock %}

{% block content %}
<div class="container narrow-page">
  <div class="form-shell">
    <h1 class="h3 mb-3">Create Account</h1>
    <form method="post">
      <div class="mb-3">
        <label class="form-label" for="name">Name</label>
        <input class="form-control" id="name" name="name" type="text" autocomplete="name" required>
      </div>
      <div class="mb-3">
        <label class="form-label" for="email">Email</label>
        <input class="form-control" id="email" name="email" type="email" autocomplete="email" required>
      </div>
      <div class="mb-3">
        <label class="form-label" for="password">Password</label>
        <input class="form-control" id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
      </div>
      <button class="btn btn-dark w-100" type="submit">Create Account</button>
    </form>
    <p class="text-secondary mt-3 mb-0">Already registered? <a href="{{ url_for('auth.login') }}">Login</a>.</p>
  </div>
</div>
{% endblock %}
