{% extends "base.html" %}

{% block title %}Login | AI Career Assistant{% endblock %}

{% block content %}
<div class="container narrow-page">
  <div class="form-shell">
    <h1 class="h3 mb-3">Login</h1>
    <form method="post">
      <div class="mb-3">
        <label class="form-label" for="email">Email</label>
        <input class="form-control" id="email" name="email" type="email" autocomplete="email" required>
      </div>
      <div class="mb-3">
        <label class="form-label" for="password">Password</label>
        <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <div class="form-check mb-3">
        <input class="form-check-input" id="remember" name="remember" type="checkbox">
        <label class="form-check-label" for="remember">Remember me</label>
      </div>
      <button class="btn btn-dark w-100" type="submit">Login</button>
    </form>
    <p class="text-secondary mt-3 mb-0">New here? <a href="{{ url_for('auth.register') }}">Create an account</a>.</p>
  </div>
</div>
{% endblock %}
