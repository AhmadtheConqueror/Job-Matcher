{% extends "base.html" %}

{% block title %}Match Job | AI Career Assistant{% endblock %}

{% block content %}
<div class="container">
  <div class="page-heading">
    <div>
      <p class="eyebrow">AI analysis</p>
      <h1 class="h2 mb-0">Match CV to Job</h1>
    </div>
  </div>

  <form
    class="section-block"
    method="post"
    data-ai-loading
    data-loading-title="Matching your CV to the role"
    data-loading-message="The AI is comparing your experience with the job description and preparing focused feedback."
  >
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label" for="cv_id">CV</label>
        <select class="form-select" id="cv_id" name="cv_id" required>
          <option value="">Choose a CV</option>
          {% for cv in cvs %}
            <option value="{{ cv.id }}">{{ cv.original_filename }} - {{ cv.created_at.strftime("%Y-%m-%d") }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-3">
        <label class="form-label" for="title">Job title</label>
        <input class="form-control" id="title" name="title" type="text" required>
      </div>
      <div class="col-md-3">
        <label class="form-label" for="company">Company</label>
        <input class="form-control" id="company" name="company" type="text">
      </div>
      <div class="col-12">
        <label class="form-label" for="description">Job description</label>
        <textarea class="form-control text-area-lg" id="description" name="description" required></textarea>
      </div>
    </div>
    <div class="mt-3">
      <button class="btn btn-dark" type="submit">Run Analysis</button>
    </div>
  </form>
</div>
{% endblock %}
