{% extends "base.html" %}

{% block title %}Job Match | AI Career Assistant{% endblock %}

{% block content %}
<div class="container">
  <div class="page-heading">
    <div>
      <p class="eyebrow">AI analysis</p>
      <h1 class="h2 mb-0">Job Match</h1>
    </div>
  </div>

  <form
    class="section-block"
    method="post"
    data-ai-stream-form
    data-ai-stream-kind="match"
    data-ai-stream-url="{{ url_for('main.stream_match_job') }}"
  >
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label" for="cv_id">CV</label>
        <select class="form-select" id="cv_id" name="cv_id" required>
          <option value="">Choose a CV</option>
          {% for cv in cvs %}
            <option value="{{ cv.id }}">{{ cv.original_filename }} - {{ cv.created_at.strftime("%Y-%m-%d") }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-3">
        <label class="form-label" for="title">Job title</label>
        <input class="form-control" id="title" name="title" type="text" required>
      </div>
      <div class="col-md-3">
        <label class="form-label" for="company">Company</label>
        <input class="form-control" id="company" name="company" type="text">
      </div>
      <div class="col-12">
        <label class="form-label" for="description">Job description</label>
        <textarea class="form-control text-area-lg" id="description" name="description" required></textarea>
      </div>
    </div>
    <div class="mt-3">
      <button class="btn btn-outline-dark" type="button" data-ai-stream-stop hidden disabled>Stop</button>
      <button class="btn btn-dark" type="submit">Run Analysis</button>
    </div>
  </form>

  <article class="section-block analysis-card ai-stream-result" data-ai-stream-result="match" hidden>
    <div class="ai-stream-actions">
      <a class="btn btn-outline-dark btn-sm" href="#" data-ai-stream-result-link hidden>Open Saved Analysis</a>
      <a class="btn btn-outline-dark btn-sm" href="#" data-ai-stream-download-link hidden>Download PDF</a>
    </div>
    <div class="analysis-content">
      <div class="chat-stream-status" data-ai-stream-status aria-live="polite"></div>
      <pre class="analysis-output ai-stream-output" data-ai-stream-output></pre>
    </div>
  </article>
  <nav class="workflow-nav" aria-label="Career workflow navigation">
    <a class="workflow-nav-link" href="{{ url_for('main.upload_cv') }}" aria-label="Back to My CV">
      <span aria-hidden="true">&larr;</span> My CV
    </a>
    <a class="workflow-nav-link" href="{{ url_for('main.cover_letter') }}" aria-label="Continue to Cover Letter">
      Cover Letter <span aria-hidden="true">&rarr;</span>
    </a>
  </nav>
</div>
{% endblock %}
